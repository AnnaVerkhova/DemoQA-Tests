name: UI + API Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: classic_books_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 123qwe456
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Wait for PostgreSQL
        run: sleep 10

      - name: Init DB
        run: |
          sudo apt-get install -y postgresql-client
          PGPASSWORD=123qwe456 psql -h localhost -U postgres -d classic_books_db -c "
          CREATE TABLE IF NOT EXISTS classic_books (
              id SERIAL PRIMARY KEY,
              username VARCHAR(50) UNIQUE,
              password VARCHAR(50),
              book_title VARCHAR(255)
          );

          INSERT INTO classic_books (username, password, book_title)
          VALUES 
          ('Anna', '0123A', 'Pride and Prejudice'),
          ('Alisa', '1234A', 'Jane Eyre'),
          ('Olga', '2345O', 'War and Peace')
          ON CONFLICT (username) DO NOTHING;
          "

      - name: Build and run tests
        run: mvn clean test

      - name: Generate Allure Report
        run: mvn allure:report

      - name: Upload Allure Results
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: target/allure-results

      - name: Upload Allure Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/allure-report